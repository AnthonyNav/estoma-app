@if (!isAuthentication()) {
  <header class="app-header">
    <a class="brand" routerLink="/wash/student">Lavado ultrasónico</a>

    @if (showSignOut()) {
      <nav aria-label="Sesión">
        <a
          class="app-header__sign-out"
          routerLink="/authentication/access"
          [queryParams]="{ choose: 1 }"
          >Mis sistemas</a
        >
        <button type="button" class="app-header__sign-out" (click)="logout()">Salir</button>
      </nav>
    }
  </header>
}

<main class="app-content" [class.app-content--authentication]="isAuthentication()">
  @if (!isAuthentication() && sessionStore.notice(); as message) {
    <p role="status">{{ message }}</p>
  }
  <router-outlet />
</main>
