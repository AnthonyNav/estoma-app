@if (isWash()) {
  <header class="wash-header">
    <div class="wash-header__inner">
      <div class="wash-header__brand">
        <span class="wash-header__symbol" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 4c-3 5-8 10-8 15a8 8 0 0 0 16 0c0-5-5-10-8-15Z" />
            <path d="M12 20a4 4 0 0 0 4 4" />
          </svg>
        </span>
        <div>
          <p class="wash-header__title">Lavado ultrasónico</p>
          <p class="wash-header__subtitle">Facultad de Estomatología</p>
        </div>
      </div>
      <button
        type="button"
        class="wash-header__logout"
        (click)="logout()"
        aria-label="Cerrar sesión"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M10 4H5v16h5M9 12h11m-4-4 4 4-4 4" />
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </header>
}

<main
  class="app-content"
  [class.app-content--authentication]="isAuthentication()"
  [class.app-content--student]="isStudentHome()"
>
  @if (!isAuthentication() && sessionStore.notice(); as message) {
    <p role="status">{{ message }}</p>
  }
  <router-outlet />
</main>
