<div
  [class]="'appointment-qr appointment-qr--' + size"
  [attr.aria-label]="unavailable() ? 'No se pudo mostrar el código QR' : 'Código QR de la cita'"
  role="img"
>
  @if (imageUrl(); as imageUrl) {
    <img alt="" [src]="imageUrl" />
  } @else if (unavailable()) {
    <p class="appointment-qr__fallback">No pudimos mostrar el QR. Intenta actualizar tu cita.</p>
  } @else {
    <div class="appointment-qr__skeleton" aria-hidden="true"></div>
  }
</div>
