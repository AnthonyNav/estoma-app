<div class="sign-in-screen">
  <section class="sign-in-panel">
    <div class="sign-in-card card" aria-labelledby="sign-in-title">
      <h1 id="sign-in-title" class="text-h1">Facultad de Estomatología</h1>
      <p class="text-body-md subtitle">Universidad Autónoma de Puebla — BUAP</p>

      @if (signedInAs(); as accountId) {
        <p class="toast toast-success" role="status">Sesión iniciada como {{ accountId }}.</p>
      }

      @if (error(); as message) {
        <p class="toast toast-error" role="alert">{{ message }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label class="field-label" for="identifier">Matrícula o usuario</label>
          <input
            id="identifier"
            class="field-input"
            type="text"
            autocomplete="username"
            formControlName="identifier"
            placeholder="Ingresa tu matrícula"
            [attr.aria-invalid]="
              form.controls.identifier.invalid && form.controls.identifier.touched
            "
          />
        </div>

        <div class="field">
          <label class="field-label" for="password">Contraseña</label>
          <div class="password-input">
            <input
              id="password"
              class="field-input"
              [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="current-password"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
              [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            />
            <button
              class="password-toggle"
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (passwordVisible()) {
                <svg lucideEyeOff [size]="20"></svg>
              } @else {
                <svg lucideEye [size]="20"></svg>
              }
            </button>
          </div>
        </div>

        <button class="btn btn-primary sign-in-submit" [disabled]="submitting()" type="submit">
          {{ submitting() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="text-body-sm support-link">
        ¿Problemas para acceder?
        <a href="mailto:soporte@estomatologia.buap.mx">Contacta a soporte</a>
      </p>
    </div>
  </section>

  <aside class="sign-in-visual" aria-hidden="true"></aside>
</div>
