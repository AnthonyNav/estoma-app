<section class="sign-in" aria-labelledby="sign-in-title">
  <p class="eyebrow">Inicio de sesión</p>
  <h1 id="sign-in-title">Plataforma de Estomatología</h1>
  <p class="intro">Sistema de gestión clínica y de laboratorios de la Facultad de Estomatología.</p>

  @if (signedInAs(); as accountId) {
    <p class="success" role="status">Signed in as {{ accountId }}.</p>
  }

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Correo electrónico
      <input
        autocomplete="username"
        formControlName="identifier"
        placeholder="Ingresa tu correo"
        required
      />
    </label>

    <label>
      Contraseña
      <div class="password-input-container">
        <input
          autocomplete="current-password"
          formControlName="password"
          placeholder="••••••••"
          required
          [type]="showPassword() ? 'text' : 'password'"
        />
        <button
          type="button"
          class="eye-btn"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path
                d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
              />
              <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          }
        </button>
      </div>
    </label>

    <button [disabled]="submitting()" type="submit">
      {{ submitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</section>
