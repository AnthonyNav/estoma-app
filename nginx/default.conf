server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api {
    return 404;
  }

  location ^~ /api/ {
    proxy_pass http://platform-bff.develop.svc.cluster.local:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /ngsw.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /version.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only Angular fingerprinted bundles are immutable; public assets may retain names.
  location ~* "-[a-z0-9]{8,}\.(?:css|js)$" {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webmanifest)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
}
